[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allied-vision-camera"
version = "0.1.0"
description = "Snapshot-oriented Allied Vision (vmbpy) camera wrapper for the yb2 lab"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "vmbpy~=1.2",
    "numpy~=2.2",
    "matplotlib~=3.10",
]

[project.urls]
Repository = "https://github.com/UCBoulder/allied-vision-camera"

[tool.setuptools]
packages = ["allied_vision"]
